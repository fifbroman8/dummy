plugins {
    id 'com.android.application' version '8.3.0'
}

android {
    namespace 'com.abc'
    compileSdk 34

    defaultConfig {
        applicationId "com.ss.android.ugc.aweme.lite"
        minSdkVersion 21
        targetSdkVersion 34
        versionCode 99999
        versionName "1.0"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
}

dependencies {
    implementation 'androidx.core:core:1.12.0'
}

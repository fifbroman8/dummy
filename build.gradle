plugins {
    id 'com.android.application' version '8.3.0'
}

android {
    namespace 'com.abc'
    compileSdk 34

    defaultConfig {
        applicationId "om.smile.gifmaker"
        minSdkVersion 21
        targetSdkVersion 34
        versionCode 1
        versionName "1.0"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
}

dependencies {
    implementation 'androidx.core:core:1.12.0'
}

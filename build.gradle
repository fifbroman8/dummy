plugins {
    // 建议将 8.1.0 升级到能更好兼容现代 Gradle 环境的版本（如 8.4.0 或更高）
    id 'com.android.application' version '8.4.0'
}

android {
    // 核心硬性要求：AGP 8.0+ 必须显式声明 namespace 命名空间
    namespace 'com.abc.dummy'
    
    // 现代语法：用 compileSdk 代替旧版的 compileSdkVersion
    compileSdk 34

    defaultConfig {
        applicationId "com.abc.dummy"
        minSdkVersion 21
        targetSdkVersion 34
        versionCode 1
        versionName "1.0"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.5.1'
}

plugins {
    id 'com.android.application' version '8.4.0'
}

android {
    namespace 'com.abc.dummy'
    compileSdk 34

    defaultConfig {
        applicationId "com.abc.dummy"
        minSdk 21
        targetSdk 34
        versionCode 1
        versionName "1.0"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
}

repositories {
    google()
    mavenCentral()
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
}
